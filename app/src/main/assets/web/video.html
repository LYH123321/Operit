<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>影视中心</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>window.Hls||document.write('<script src="https://unpkg.com/hls.js@1/dist/hls.min.js"><\/script>')</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#e6edf3;font-family:system-ui,sans-serif;padding-bottom:80px}
.h{padding:14px 16px;font-size:20px;font-weight:700;background:#161b22;position:sticky;top:0;z-index:5;border-bottom:1px solid #30363d}
.search{display:flex;gap:8px;padding:12px 16px;background:#161b22;position:sticky;top:52px;z-index:5}
.search input{flex:1;padding:10px 14px;border-radius:8px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;font-size:15px;outline:none}
.search button{padding:0 20px;border-radius:8px;border:none;background:#238636;color:#fff;font-size:15px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:12px;padding:14px 16px}
.card{cursor:pointer}
.poster{aspect-ratio:3/4;background:#21262d;border-radius:8px;overflow:hidden;position:relative}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.vname{font-size:12px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vmeta{font-size:10px;color:#8b949e}
.src{position:absolute;top:4px;left:4px;background:#1f6febcc;font-size:9px;padding:1px 5px;border-radius:4px}
#playerWrap{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column}
#playerWrap video{flex:1;background:#000}
.pbar{padding:10px 14px;background:#161b22}
.pbar .t{font-size:15px;font-weight:600;margin-bottom:6px}
.eps{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px;overflow:auto;max-height:40vh}
.eps button{padding:6px 12px;border-radius:6px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;font-size:13px}
.eps button.on{background:#238636;border-color:#238636}
.tabs{display:flex;gap:8px;padding:8px 14px;flex-wrap:wrap}
.tabs button{padding:5px 12px;border-radius:14px;border:1px solid #30363d;background:#161b22;color:#8b949e;font-size:12px}
.tabs button.on{color:#fff;border-color:#238636;background:#23863622}
.close{position:absolute;top:10px;right:10px;z-index:60;padding:6px 14px;border-radius:6px;background:#21262dee;border:none;color:#fff}
.loading,.empty{padding:40px;text-align:center;color:#8b949e}
.line{height:2px;background:linear-gradient(90deg,#238636,#1f6feb);animation:s 1s infinite alternate;margin:10px 16px;border-radius:2px}
@keyframes s{from{width:20%}to{width:90%}}
</style>
</head>
<body>
<div class="h">🎬 影视中心 <span style="font-size:11px;color:#8b949e">多源免费聚合</span></div>
<div class="search">
  <input id="kw" placeholder="搜索电视剧 / 电影 / 综艺…" value="庆余年">
  <button onclick="doSearch()">搜索</button>
</div>
<div id="status" class="empty">输入片名开始搜索，资源来自公开采集站</div>
<div id="line" class="line" style="display:none"></div>
<div id="grid" class="grid"></div>

<div id="playerWrap">
  <button class="close" onclick="closePlayer()">✕ 关闭</button>
  <video id="video" controls autoplay playsinline></video>
  <div class="pbar"><div class="t" id="ptitle"></div><div id="ptabs" class="tabs"></div></div>
  <div id="eps" class="eps"></div>
</div>
<script>
// 苹果CMS 采集资源站（JSON API，均经 /api/proxy 转发解决 CORS）
const SOURCES = [
  {name:'量子', url:'https://cj.lziapi.com/api.php/provide/vod/'},
  {name:'非凡', url:'https://cj.ffzy.tv/api.php/provide/vod/'},
  {name:'天空', url:'https://api.tiankongapi.com/api.php/provide/vod/'},
  {name:'快看', url:'https://kuaikan-api.com/api.php/provide/vod/'},
  {name:'魔猪', url:'https://caiji.moduzy.com/api.php/provide/vod/'},
];
let curList=[], curEps=[], curEp=0;

function px(u){ return '/api/proxy?url=' + encodeURIComponent(u); }

async function fetchJson(url){
  const r = await fetch(px(url), {headers:{'User-Agent':'Mozilla/5.0 (Linux; Android 13) Chrome/120 Mobile'}});
  if(!r.ok) throw new Error(r.status);
  return r.json();
}

async function doSearch(){
  const kw = document.getElementById('kw').value.trim();
  if(!kw) return;
  document.getElementById('status').className='loading';
  document.getElementById('status').textContent='搜索中…';
  document.getElementById('line').style.display='block';
  document.getElementById('grid').innerHTML='';
  curList=[];
  const jobs = SOURCES.map(async s=>{
    try{
      const d = await fetchJson(s.url + '?ac=videolist&wd=' + encodeURIComponent(kw));
      (d.list||[]).forEach(v=>curList.push({s:s.name, v:v}));
    }catch(e){}
  });
  await Promise.all(jobs);
  document.getElementById('line').style.display='none';
  if(!curList.length){ document.getElementById('status').className='empty'; document.getElementById('status').textContent='无结果，换关键词试试'; return; }
  document.getElementById('status').style.display='none';
  render();
}

function render(){
  const g=document.getElementById('grid'); g.innerHTML='';
  curList.forEach((it,i)=>{
    const v=it.v;
    const el=document.createElement('div'); el.className='card';
    const pic=v.vod_pic||'';
    el.innerHTML=`<div class="poster">${pic?`<img src="${px(pic)}" loading="lazy" onerror="this.style.display='none'">`:''}<span class="src">${it.s}</span></div>
      <div class="vname">${v.vod_name||''}</div><div class="vmeta">${(v.vod_year||'')+' · '+(v.vod_remarks||v.type_name||'')}</div>`;
    el.onclick=()=>openDetail(it.s, v.vod_id);
    g.appendChild(el);
  });
}

async function openDetail(srcName, id){
  const s=SOURCES.find(x=>x.name===srcName);
  try{
    const d=await fetchJson(s.url+'?ac=detail&ids='+id);
    const v=d.list[0];
    curEps=[]; 
    const froms=(v.vod_play_from||'').split('$$$');
    const urls=(v.vod_play_url||'').split('$$$');
    froms.forEach((f,li)=>{
      (urls[li]||'').split('#').forEach(seg=>{
        const [name,url]=seg.split('$');
        if(url) curEps.push({line:f, name:name, url:url});
      });
    });
    document.getElementById('ptitle').textContent=v.vod_name+'（'+srcName+'）';
    // 线路 tabs
    const lines=[...new Set(curEps.map(e=>e.line))];
    const tb=document.getElementById('ptabs'); tb.innerHTML='';
    lines.forEach(ln=>{
      const b=document.createElement('button'); b.textContent=ln;
      b.onclick=()=>renderEps(ln);
      tb.appendChild(b);
    });
    document.getElementById('playerWrap').style.display='flex';
    if(lines.length) renderEps(lines[0]);
  }catch(e){ alert('加载失败:'+e.message); }
}

function renderEps(line){
  document.querySelectorAll('#ptabs button').forEach(b=>b.classList.toggle('on',b.textContent===line));
  const eps=curEps.filter(e=>e.line===line);
  const eb=document.getElementById('eps'); eb.innerHTML='';
  eps.forEach((e,i)=>{
    const b=document.createElement('button'); b.textContent=e.name||('第'+(i+1)+'集');
    b.onclick=()=>play(b,e.url,e.name);
    eb.appendChild(b);
  });
}

let hls=null;
function play(btn,url,name){
  document.querySelectorAll('#eps button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  const v=document.getElementById('video');
  if(hls){hls.destroy();hls=null;}
  const real = url.includes('.m3u8') ? px(url) : url; // m3u8 经代理拉流
  if(url.includes('.m3u8') && window.Hls && Hls.isSupported()){
    const abs = new URL(url, location.href).href;
    hls=new Hls({
      pLoader: class extends Hls.DefaultConfig.loader {
        load(context, config, callbacks){
          // 把 m3u8 里的相对分片地址改写成绝对URL
          if(context.url && context.url.includes('.m3u8')){
            const orig = callbacks.onSuccess;
            callbacks.onSuccess = function(response, stats, ctx, networkDetails){
              if(response.data && typeof response.data === 'string'){
                let base = new URL(ctx.url, location.href);
                // ctx.url 可能已被代理，还原真实地址
                if(ctx.url.startsWith(location.origin + '/api/proxy')){
                  try{ const ru = new URL(ctx.url).searchParams.get('url'); if(ru) base = new URL(ru); }catch(e){}
                }
                response.data = response.data.replace(/^([^#\n]*\.ts[^#\n]*|[^#\n]*\.m3u8[^#\n]*)$/gm, (m)=>{
                  if(!m.trim()) return m;
                  try{ return new URL(m.trim(), base).href; }catch(e){ return m; }
                });
              }
              orig(response, stats, ctx, networkDetails);
            };
          }
          super.load(context, config, callbacks);
        }
      },
      xhrSetup:x=>{ },
      fragLoadingTimeOut:30000, manifestLoadingTimeOut:20000
    });
    hls.on(Hls.Events.ERROR,(ev,data)=>{
      if(data.fatal){ document.getElementById('ptitle').textContent='播放失败：'+(data.details||data.type)+'（可换线路或换源试试）'; }
    });
    hls.loadSource(real);
    hls.attachMedia(v);
  } else { v.src=real; }
  v.play().catch(()=>{});
  document.getElementById('ptitle').textContent=name+' · 播放中';
}

function closePlayer(){
  const v=document.getElementById('video'); v.pause();
  if(hls){hls.destroy();hls=null;}
  document.getElementById('playerWrap').style.display='none';
}
document.getElementById('kw').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});
</script>
</body>
</html>
